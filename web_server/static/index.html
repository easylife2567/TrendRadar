<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>TrendRadar · 舆情监测中心</title>
    <script>
      // 首访主题：localStorage 优先，其次系统偏好，默认 dark（design/04 §5）
      // 内联执行避免暗色用户闪白屏
      ;(function () {
        var saved = localStorage.getItem('trendradar_theme')
        var theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-lXRP88HI.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DqeBLZLw.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
